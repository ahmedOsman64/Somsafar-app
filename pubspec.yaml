name: somsafar_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_web_plugins:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.0

  # UI
  google_fonts: ^8.0.2
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  pdf: ^3.11.1
  printing: ^5.13.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  crypto: ^3.0.7
  mailer: ^6.6.0
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0

  # Supabase
  supabase_flutter: ^2.8.0
  supabase: ^2.0.0

  url_launcher: ^6.3.1
  flutter_dotenv: ^5.1.0

  # Image Optimization
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  analyzer: ^10.0.2
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  meta: ^1.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
  windows:
    generate: true